openapi: 3.1.0

info:
  title: AI Interview Simulator API
  version: 0.1.0

paths:
    /auth/me:
    get:
      summary: Get the currently logged-in user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    /auth/login:
      post:
        summary: Exchange credentials for an access token
        operationId: login
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRequest'
        responses:
          '200':
            description: Authenticated
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthResponse'
          '401':
            description: Invalid email or password
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ApiError'
    /auth/register:
      post:
        summary: Create a new account
        operationId: register
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterRequest'
        responses:
          '201':
            description: Account created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthResponse'
          '409':
            description: Email already registered
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ApiError'

    /questions:
      get:
        summary: List interview questions
        operationId: listQuestions
        security:
          - bearerAuth: []
        parameters:
          - name: type
            in: query
            schema:
              $ref: '#/components/schemas/InterviewType'
          - name: limit
            in: query
            schema:
              type: integer
              default: 20
        responses:
          '401' :
            description: Not authenticated
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ApiError'
          '200':
            description: A list of questions
            content:
              application/json:
                schema:
                  type: object
                  required: [items, total]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Question'
                    total:
                      type: integer
    /sessions:
      post:
        summary: Start a new interview session
        operationId: createSession
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionRequest'
        responses:
          '201':
            description: Session created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Session'

    /sessions/{sessionId}:
      get:
        summary: Get one interview session
        operationId: getSession
        parameters:
          - name: sessionId
            in: path
            required: true
            schema:
              type: string
        responses:
          '200':
            description: The session
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Session'
          '404':
            description: Session not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ApiError'

    /sessions/{sessionId}/answers:
      post:
        summary: Submit an answer and receive feedback
        operationId: submitAnswer
        parameters:
          - name: sessionId
            in: path
            required: true
            schema:
              type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAnswerRequest'
        responses:
          '201':
            description: Feedback for the submitted answer
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Feedback'
      /auth/refresh:
        post:
          summary: Exchange a refresh cookie for a new access token
          operationId: refreshSession
          responses:
            '200':
              description: New access token issued
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AuthResponse'
            '401':
              description: Missing, expired, or reused refresh token
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ApiError'

    /auth/logout:
      post:
        summary: Revoke the current refresh token
        operationId: logout
        responses:
          '204':
            description: Logged out

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, displayName, role, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [user,admin]
        createdAt:
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    ApiError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        displayName:
          type: string

    InterviewType:
      type: string
      enum: [technical, behavioral, system_design]

    Difficulty:
      type: string
      enum: [easy, medium, hard]

    Question:
      type: object
      required: [id, type, difficulty, prompt]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/InterviewType'
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        prompt:
          type: string
    SessionStatus:
      type: string
      enum: [in_progress, completed]

    CreateSessionRequest:
      type: object
      required: [type, difficulty, questionCount]
      properties:
        type:
          $ref: '#/components/schemas/InterviewType'
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        questionCount:
          type: integer
          minimum: 1
          maximum: 10

    Session:
      type: object
      required: [id, type, difficulty, status, createdAt, questions]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/InterviewType'
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        status:
          $ref: '#/components/schemas/SessionStatus'
        createdAt:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'

    SubmitAnswerRequest:
      type: object
      required: [questionId, content]
      properties:
        questionId:
          type: string
        content:
          type: string
          minLength: 1

    ScoreDimension:
      type: string
      enum: [correctness, communication, depth, edge_cases]

    Score:
      type: object
      required: [dimension, value, justification]
      properties:
        dimension:
          $ref: '#/components/schemas/ScoreDimension'
        value:
          type: integer
          minimum: 0
          maximum: 10
        justification:
          type: string

    Feedback:
      type: object
      required: [answerId, questionId, scores, strengths, improvements]
      properties:
        answerId:
          type: string
        questionId:
          type: string
        scores:
          type: array
          items:
            $ref: '#/components/schemas/Score'
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        followUpQuestion:
          type: string
